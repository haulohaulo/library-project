<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./javascript.js" defer></script>
</head>
<body>
    
    <dialog>
        <div>
            <legend>Add a new book below</legend>
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title">
            </div>
            <div>
                <label for="author">Author</label>
                <input type="text" id="author" name="title">
            </div>
            <div>
                <label for="pages">Number of Pages</label>
                <input type="text" id="pages" name="title">
            </div>
            <div>
                <label for="readOrNot">Read?</label>
                <input type="text" id="readOrNot" name="title">
            </div>
            <button type="submit">Submit</button>

            
        </div>
        
        <button class="close">Close</button>
    </dialog>
    <button class="addBook">Add New Book</button>
    <div class="container"></div>
    
</body>
</html>
